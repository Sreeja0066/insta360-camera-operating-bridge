workflows:
  ios-workflow:
    name: iOS Build & Sign
    instance_type: mac_mini_m1
    environment:
      groups:
        - apple_auth
      vars:
        GIT_LFS_SKIP_SMUDGE: "1"
      flutter: stable
      xcode: latest
    integrations:
      app_store_connect: "[Expo] EAS Submit K3Lun7NC7r"
    scripts:
      - name: Download SDK Frameworks
        script: |
          # Download frameworks from GitHub Release
          FRAMEWORKS_URL="https://github.com/Sreeja0066/insta360-camera-operating-bridge/releases/download/sdk-v1.9.2/Frameworks.zip"
          curl -L -o /tmp/ios-frameworks.zip "$FRAMEWORKS_URL"
          
          # We must NOT delete the whole directory because it contains INSCameraSDK.podspec which is in Git
          # Only delete the .xcframework folders (which are currently LFS pointers)
          find "$CM_BUILD_DIR/insta360-bridge-flutter/ios/Frameworks" -name "*.xcframework" -type d -exec rm -rf {} +
          
          # Extract real frameworks into the folder
          unzip -o /tmp/ios-frameworks.zip -d "$CM_BUILD_DIR/insta360-bridge-flutter/ios/Frameworks/"
          
          # If the zip extracted into a subfolder named 'Frameworks', move them up
          if [ -d "$CM_BUILD_DIR/insta360-bridge-flutter/ios/Frameworks/Frameworks" ]; then
            mv $CM_BUILD_DIR/insta360-bridge-flutter/ios/Frameworks/Frameworks/* $CM_BUILD_DIR/insta360-bridge-flutter/ios/Frameworks/
            rm -rf $CM_BUILD_DIR/insta360-bridge-flutter/ios/Frameworks/Frameworks
          fi
      - name: Install dependencies
        script: |
          cd insta360-bridge-flutter
          flutter pub get
          # This command specifically generates the required Generated.xcconfig file correctly
          flutter build ios --no-codesign --config-only
          cd ios
          pod install
      - name: Build Flutter iOS
        script: |
          cd insta360-bridge-flutter
          flutter build ios --release --no-codesign
      - name: Code Signing & IPA Generation
        script: |
          # Debug: List the profiles Codemagic downloaded
          echo "Listing profiles in ~/Library/MobileDevice/Provisioning Profiles/:"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "Directory not found"
          
          # Fetch profiles from Codemagic UI
          xcode-project use-profiles
          
          # Build signed IPA using standard flutter command
          cd insta360-bridge-flutter
          flutter build ipa --release --no-codesign \
            --export-method app-store \
            --build-number=$BUILD_NUMBER
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
